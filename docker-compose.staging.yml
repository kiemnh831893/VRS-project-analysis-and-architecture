name: vrs-staging

services:
  db:
    image: postgres:16-alpine
    container_name: vrs-staging-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
    expose:
      - '5432'
    volumes:
      - staging_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - vrs-staging

  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: vrs-staging-migrate
    restart: on-failure
    env_file: ${STAGING_ENV_FILE:-.env.staging}
    environment:
      NODE_ENV: staging
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      CORS_ORIGIN: ${CORS_ORIGIN:?CORS_ORIGIN is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
    depends_on:
      db:
        condition: service_healthy
    command: ['pnpm', 'exec', 'prisma', 'migrate', 'deploy']
    networks:
      - vrs-staging

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: vrs-staging-api
    restart: unless-stopped
    env_file: ${STAGING_ENV_FILE:-.env.staging}
    environment:
      NODE_ENV: staging
      PORT: 4000
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      CORS_ORIGIN: ${CORS_ORIGIN:?CORS_ORIGIN is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1d}
      TRUST_PROXY: 1
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-900000}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-300}
      AUTH_RATE_LIMIT_MAX: ${AUTH_RATE_LIMIT_MAX:-30}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - '127.0.0.1:${STAGING_API_PORT:-4001}:4000'
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          node -e "fetch('http://localhost:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    networks:
      - vrs-staging

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: vrs-staging-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - '127.0.0.1:${STAGING_WEB_PORT:-4173}:80'
    healthcheck:
      test: ['CMD-SHELL', 'wget -q --spider http://localhost/health || exit 1']
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    networks:
      - vrs-staging

volumes:
  staging_pgdata:
    name: vrs_staging_pgdata

networks:
  vrs-staging:
    name: vrs-staging
